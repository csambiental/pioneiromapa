name: Gravar vídeo tutorial
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install -q playwright pymupdf
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -qq ffmpeg fonts-noto
      - run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          python3 tools/video/gravar_tutorial.py http://localhost:8765 /tmp/vid
          f=$(ls /tmp/vid/*.webm | head -1)
          ffmpeg -v error -y -ss 1.8 -i "$f" -r 30 -c:v libx264 -crf 21 -preset medium -pix_fmt yuv420p -movflags +faststart tutorial_pioneiros.mp4
          ls -la tutorial_pioneiros.mp4
      - run: |
          mkdir -p tutorial && mv tutorial_pioneiros.mp4 tutorial/
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tutorial; git commit -q -m "Vídeo tutorial atualizado" || true; git pull -q --rebase origin main || true; git push
