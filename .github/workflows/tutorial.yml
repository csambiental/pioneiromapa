name: Gravar vídeo tutorial
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install -q playwright pymupdf piper-tts
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -qq ffmpeg fonts-noto
          mkdir -p /tmp/voz && cd /tmp/voz
          V=https://huggingface.co/rhasspy/piper-voices/resolve/main/pt/pt_BR/faber/medium
          curl -sL -o voz.onnx $V/pt_BR-faber-medium.onnx && curl -sL -o voz.onnx.json $V/pt_BR-faber-medium.onnx.json
      - run: python3 tools/video/narrar.py tools/video/narracao.json /tmp/voz/voz.onnx /tmp/falas
      - run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          python3 tools/video/gravar_tutorial.py http://localhost:8765 /tmp/vid /tmp/falas/duracoes.json
          mkdir -p tutorial
          python3 tools/video/montar.py "$(ls /tmp/vid/*.webm | head -1)" /tmp/vid/marcas.json /tmp/falas tutorial/tutorial_pioneiros.mp4
          ls -la tutorial
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tutorial; git commit -q -m "Vídeo tutorial narrado" || true; git pull -q --rebase origin main || true; git push
