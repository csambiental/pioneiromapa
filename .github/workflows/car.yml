name: Atualizar CAR (SICAR)
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  car:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p data/_diag && (python3 tools/baixar_car.py > data/_diag/car.txt 2>&1; true)
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data; git commit -q -m "CAR: perímetros atualizados" || true; git pull -q --rebase origin main || true; git push
